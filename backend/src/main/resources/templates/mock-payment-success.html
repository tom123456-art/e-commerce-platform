<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>支付成功</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 48px 40px;
      max-width: 460px; width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,.15); text-align: center;
    }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 24px;
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 3;
                stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
    .sub { color: #6b7280; font-size: 14px; margin-bottom: 32px; }
    .info { text-align: left; background: #f8fafc; border-radius: 12px;
            padding: 20px 24px; margin-bottom: 32px; }
    .info .row { display: flex; justify-content: space-between; padding: 8px 0;
                 border-bottom: 1px solid #e5e7eb; }
    .info .row:last-child { border-bottom: none; }
    .info .label { color: #6b7280; font-size: 13px; }
    .info .value { color: #1a1a2e; font-size: 13px; font-weight: 600;
                   word-break: break-all; max-width: 240px; text-align: right; }
    .amount { font-size: 36px; font-weight: 800; color: #43e97b; margin-bottom: 32px; }
    .amount span { font-size: 20px; font-weight: 400; }
    .btn {
      display: inline-block; padding: 14px 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff; border: none; border-radius: 50px; font-size: 16px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102,126,234,.4); }
    .tip { margin-top: 20px; color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h1>支付成功</h1>
    <p class="sub">订单已完成 Mock 支付流程</p>
    <div class="amount"><span>¥</span>{{amount}}</div>
    <div class="info">
      <div class="row"><span class="label">订单编号</span><span class="value">{{orderNo}}</span></div>
      <div class="row"><span class="label">支付金额</span><span class="value">¥{{amount}}</span></div>
      <div class="row"><span class="label">商品描述</span><span class="value">{{subject}}</span></div>
    </div>
    <a class="btn" href="http://localhost:3000/orders">返回我的订单</a>
    <p class="tip">这是开发环境 Mock 支付页面，非真实交易</p>
  </div>
</body>
</html>
